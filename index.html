<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Live TV Remote</title>
<style>
  :root { --bg: #000; --fg: #fff; --card: #1c1c1c; --accent: #ffd400; --ok: #1fbf4f; --bad: #ff4d4d; --muted: #bbb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; font-size: 24px; line-height: 1.3; padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .hidden { display: none !important; }

  /* PIN screen */
  #pin h1 { font-size: 36px; text-align: center; margin: 16px 0 6px; color: var(--accent); }
  #pin p { text-align: center; margin: 0 0 14px; font-size: 26px; }
  #pinDots { text-align: center; font-size: 48px; letter-spacing: 14px; min-height: 64px; direction: ltr; }
  #pinMsg { text-align: center; color: var(--bad); min-height: 34px; font-size: 22px; }
  #keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; direction: ltr; margin-top: 8px; }
  #keypad button { background: var(--card); border: 3px solid #444; border-radius: 18px; font-size: 40px; font-weight: 700; padding: 18px 0; }
  #keypad button:active { background: #333; }
  #keypad .ok { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Main screen */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topbar button { background: var(--card); border: 2px solid #555; border-radius: 12px; padding: 8px 16px; font-size: 22px; }
  .topbar .link { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 18px; padding: 8px 4px; }
  #now { border: 4px solid var(--accent); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; background: #111; }
  #now .label { font-size: 20px; color: var(--muted); }
  #now .name { font-size: 38px; font-weight: 800; color: var(--accent); margin: 4px 0; word-break: break-word; }
  #now .state { font-size: 24px; }
  #now.off { border-color: var(--bad); }
  #now.off .name { color: var(--bad); font-size: 30px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .row button { background: #2a2a2a; border: 3px solid #666; border-radius: 16px; padding: 16px 4px; font-size: 24px; font-weight: 700; }
  .ch { display: flex; align-items: center; gap: 16px; width: 100%; text-align: start; background: var(--card); border: 4px solid var(--card); border-radius: 18px; padding: 10px 14px; margin-bottom: 10px; font-size: 30px; font-weight: 700; min-height: 84px; }
  .ch .logo { flex: 0 0 auto; width: 96px; height: 62px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ch .logo img { max-width: 88px; max-height: 56px; }
  .ch .logo.icon { background: var(--accent); color: #000; font-size: 32px; }
  .ch.current { border-color: var(--accent); }
  .ch.current::after { content: "●"; color: var(--accent); margin-inline-start: auto; font-size: 26px; }
  button.sent { background: var(--ok) !important; border-color: var(--ok) !important; color: #000 !important; }
  button.failed { background: var(--bad) !important; border-color: var(--bad) !important; color: #000 !important; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; background: #222; border: 3px solid var(--accent); border-radius: 16px; padding: 14px; text-align: center; font-size: 24px; display: none; }
  #nosubtle { color: var(--bad); text-align: center; font-size: 24px; margin-top: 20px; }
</style>
</head>
<body>

<section id="pin" class="hidden">
  <h1>Live TV</h1>
  <p data-t="enterPin"></p>
  <div id="pinDots"></div>
  <div id="pinMsg"></div>
  <div id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="delete">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">OK</button>
  </div>
  <div id="nosubtle" class="hidden" data-t="noSubtle"></div>
</section>

<section id="main" class="hidden">
  <div class="topbar">
    <button id="langBtn"></button>
    <button id="changePin" class="link" data-t="changePin"></button>
  </div>
  <div id="now">
    <div class="label" data-t="nowOnTv"></div>
    <div class="name" id="nowName">…</div>
    <div class="state" id="nowState"></div>
  </div>
  <div class="row">
    <button data-cmd="prev" data-t="prev"></button>
    <button data-cmd="list" data-t="list"></button>
    <button data-cmd="next" data-t="next"></button>
  </div>
  <div id="channels"></div>
</section>

<div id="toast"></div>

          changePin: 'Change PIN', nowOnTv: 'Now on TV', prev: '▲ Previous', list: 'List', next: 'Next ▼',
          lang: 'عربي', playing: 'Playing', listState: 'Channel list is open', intro: 'Opening video', youtube: 'Playing on YouTube',
          hidden: 'App closed or in the background', off: 'TV not connected', offHelp: 'Open Live TV on the TV, or check the PIN',
          waiting: 'Connecting…', sendFail: 'Not sent. Check the internet.', ago: '', min: 'min ago', now: 'just now', confirmChange: 'Change the PIN?' }
  };
  var lang = store('ltvLang') || 'ar';
  var topic = '', pin = '', stateSource = null, lastState = null, lastStateAt = 0, toastTimer = null;

  function store(k, v) {
    try { if (v === undefined) { return localStorage.getItem(k); } if (v === null) { localStorage.removeItem(k); } else { localStorage.setItem(k, v); } } catch (e) {}
    return null;
  }
  function $(id) { return document.getElementById(id); }
  function tr(k) { return T[lang][k] || k; }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) { els[i].textContent = tr(els[i].getAttribute('data-t')); }
    $('langBtn').textContent = tr('lang');
    renderChannels();
    renderNow();
  }

  // ----- PIN -----
  function showPin() {
    pin = '';
    $('pinDots').textContent = '';
    $('pinMsg').textContent = '';
    $('main').classList.add('hidden');
    $('pin').classList.remove('hidden');
    if (!(window.crypto && crypto.subtle)) { $('nosubtle').classList.remove('hidden'); }
  }
  function deriveTopic(p) {
    var data = new TextEncoder().encode('livetv-remote:' + p);
    return crypto.subtle.digest('SHA-256', data).then(function (buf) {
      var b = new Uint8Array(buf), h = '';
      for (var i = 0; i < b.length; i++) { h += ('0' + b[i].toString(16)).slice(-2); }
      return 'ltv-' + h.slice(0, 24);
    });
  }
  $('keypad').addEventListener('click', function (e) {
    var k = e.target.getAttribute('data-k');
    if (!k) { return; }
    $('pinMsg').textContent = '';
    if (k === 'del') { pin = pin.slice(0, -1); }
    else if (k === 'ok') {
      if (pin.length < 4) { $('pinMsg').textContent = tr('wrongLen'); return; }
      store('ltvPin', pin);
      start();
      return;
    }
    else if (pin.length < 12) { pin += k; }
    $('pinDots').textContent = new Array(pin.length + 1).join('●');
  });

  function start() {
    var p = store('ltvPin');
    if (!p) { return showPin(); }
    if (!(window.crypto && crypto.subtle)) { return showPin(); }
    deriveTopic(p).then(function (t) {
      topic = t;
      $('pin').classList.add('hidden');
      $('main').classList.remove('hidden');
      lastState = null; lastStateAt = 0;
      applyLang();
      listenState();
      send({ cmd: 'status' });
    });
  }

  // ----- channels -----
  function renderChannels() {
    var box = $('channels');
    box.innerHTML = '';
    CHANNELS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'ch';
      b.setAttribute('data-ch', c.id);
      var logo = document.createElement('span');
      logo.className = 'logo' + (LOGOS[c.id] ? '' : ' icon');
      if (LOGOS[c.id]) { var img = document.createElement('img'); img.src = LOGOS[c.id]; img.alt = ''; logo.appendChild(img); }
      else { logo.textContent = c.icon || '▶'; }
      b.appendChild(logo);
      var n = document.createElement('span');
      n.textContent = c[lang];
      b.appendChild(n);
      b.addEventListener('click', function () { send({ cmd: 'play', ch: c.id }, b); });
      box.appendChild(b);
    });
    markCurrent();
  }
  function markCurrent() {
    var cur = lastState && (lastState.state === 'playing' || lastState.state === 'youtube') ? lastState.ch : null;
    var bs = document.querySelectorAll('.ch');
    for (var i = 0; i < bs.length; i++) { bs[i].classList.toggle('current', bs[i].getAttribute('data-ch') === cur); }
  }
  var rowBtns = document.querySelectorAll('.row button');
  for (var i = 0; i < rowBtns.length; i++) {
    (function (b) { b.addEventListener('click', function () { send({ cmd: b.getAttribute('data-cmd') }, b); }); })(rowBtns[i]);
  }

  // ----- sending commands -----
  function flash(b, cls) {
    if (!b) { return; }
    b.classList.remove('sent', 'failed');
    b.classList.add(cls);
    setTimeout(function () { b.classList.remove(cls); }, 900);
  }
  function send(cmd, btn) {
    if (!topic) { return; }
    if (btn && navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
    fetch(RELAY + topic + '-cmd', { method: 'POST', body: JSON.stringify(cmd) })
      .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } flash(btn, 'sent'); })
      .catch(function () { flash(btn, 'failed'); toast(tr('sendFail')); });
  }
  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, 4000);
  }

  // ----- "Now on TV" -----
  function listenState() {
    if (stateSource) { try { stateSource.close(); } catch (e) {} }
    stateSource = new EventSource(RELAY + topic + '-state/sse?since=10m');
    stateSource.onmessage = function (ev) {
      var m, s;
      try { m = JSON.parse(ev.data); s = JSON.parse(m.message); } catch (e) { return; }
      if (!s || !s.state) { return; }
      var at = s.t || (m.time * 1000) || Date.now();
      if (lastState && at < lastStateAt) { return; }   // older than what we show
      lastState = s; lastStateAt = at;
      renderNow();
    };
  }
  function renderNow() {
    if (!$('nowName')) { return; }
    var box = $('now');
    if (!lastState || Date.now() - lastStateAt > STALE_MS) {
      box.classList.add('off');
      $('nowName').textContent = lastState ? tr('off') : (stateSource ? tr('off') : tr('waiting'));
      $('nowState').textContent = tr('offHelp');
      markCurrent();
      return;
    }
    box.classList.remove('off');
    var s = lastState, name = '';
    if (s.ch) { name = (lang === 'ar' ? s.name_ar : s.name) || s.name || s.ch; }
    var st = { playing: tr('playing'), list: tr('listState'), intro: tr('intro'), youtube: tr('youtube'), hidden: tr('hidden') }[s.state] || s.state;
    $('nowName').textContent = name || st;
    var mins = Math.floor((Date.now() - lastStateAt) / 60000);
    var when = mins < 1 ? tr('now') : (lang === 'ar' ? tr('ago') + ' ' + mins + ' ' + tr('min') : mins + ' ' + tr('min'));
    $('nowState').textContent = (name ? st + ' · ' : '') + when;
    markCurrent();
  }
  setInterval(renderNow, 20000);

  // Phones pause pages in the background: on return, reconnect and ask the TV what it shows.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && topic) { listenState(); send({ cmd: 'status' }); }
  });

  $('langBtn').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; store('ltvLang', lang); applyLang(); });
  $('changePin').addEventListener('click', function () {
    if (!confirm(tr('confirmChange'))) { return; }
    store('ltvPin', null);
    topic = '';
    if (stateSource) { try { stateSource.close(); } catch (e) {} stateSource = null; }
    showPin();
  });

  applyLang();
  start();
})();
</script>
</body>
</html>
